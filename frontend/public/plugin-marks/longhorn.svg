<!-- Longhorn's mark, redrawn: the plum badge with the white horns and head, as
     the project's stacked logo carries it. Longhorn is a CNCF project and the
     mark is its own; it is used here only to name this plugin for it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Longhorn">
    <title>Longhorn</title>
    <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="#5f224a" />
    <!-- The horns: two sweeps with rounded tips, meeting behind the head. -->
    <path
        d="M7.1 11.1c.5 3.2 3.1 5 6.6 5.6M24.9 11.1c-.5 3.2-3.1 5-6.6 5.6"
        fill="none"
        stroke="#fff"
        stroke-width="2.9"
        stroke-linecap="round"
    />
    <!-- The head, hanging below the horns. -->
    <path d="M12.8 15.2h6.4l-1 6.1c-.25 1.8-1.3 2.7-2.2 2.7s-1.95-.9-2.2-2.7z" fill="#fff" />
    <!-- The blaze down the face, cut out of the head in the badge's colour. -->
    <path d="M15.05 17.5h1.9L16 21.9z" fill="#5f224a" />
</svg>
