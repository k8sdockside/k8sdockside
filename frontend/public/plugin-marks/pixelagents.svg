<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <title>Pixel agents</title>
    <!-- A pixel person at a desk, with a monitor glowing and a spot of lava
         at their feet: the plugin in one glyph. Drawn on a 16-pixel grid so it
         stays crisp at the sidebar's 14 px, and in mid-tones so it reads on
         light and dark themes alike. -->
    <rect x="5" y="1" width="6" height="2" fill="#7a4a26" />
    <rect x="4" y="2" width="8" height="3" fill="#7a4a26" />
    <rect x="5" y="4" width="6" height="2" fill="#e8b894" />
    <rect x="3" y="6" width="10" height="5" fill="#4a86ff" />
    <rect x="1" y="10" width="14" height="2" fill="#9c6b3f" />
    <rect x="2" y="12" width="2" height="2" fill="#7a522e" />
    <rect x="12" y="12" width="2" height="2" fill="#7a522e" />
    <rect x="5" y="14" width="7" height="2" fill="#f97316" />
    <rect x="7" y="14" width="2" height="1" fill="#fde047" />
</svg>
