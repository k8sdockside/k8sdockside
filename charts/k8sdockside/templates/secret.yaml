{{- /*
Everything the chart itself turns into a Secret. The Deployment carries a
checksum of this whole file, so changing any of it rolls the pod.
*/ -}}
{{- $adminMode := include "k8sdockside.bootstrapAdminMode" . -}}
{{- $setupTokenInline := and .Values.auth.setupToken (not .Values.auth.existingSetupTokenSecret.name) -}}
{{- if .Values.clusters.kubeconfigs }}
---
# Mounted, with clusters.existingSecrets, at /etc/k8sdockside/kubeconfigs:
# one file per entry.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8sdockside.kubeconfigsSecretName" . }}
  labels:
    {{- include "k8sdockside.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $i, $c := .Values.clusters.kubeconfigs }}
  {{- $name := required (printf "clusters.kubeconfigs[%d].name is required" $i) $c.name | toString }}
  {{- /* The server skips dot-files in the directory, so a leading dot would hide the file. */}}
  {{- if not (regexMatch "^[A-Za-z0-9][-._A-Za-z0-9]*$" $name) }}
  {{- fail (printf "clusters.kubeconfigs[%d]: name %q must be letters, digits, '-', '_' or '.', not starting with '.'" $i $name) }}
  {{- end }}
  {{- $kubeconfig := required (printf "clusters.kubeconfigs[%d] (%s): kubeconfig is required" $i $name) $c.kubeconfig }}
  {{- if not (kindIs "string" $kubeconfig) }}
  {{- $kubeconfig = toYaml $kubeconfig }}
  {{- end }}
  {{ $name }}.yaml: {{ $kubeconfig | b64enc }}
  {{- end }}
{{- end }}
{{- if or .Values.auth.providers (eq $adminMode "inline") $setupTokenInline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8sdockside.authSecretName" . }}
  labels:
    {{- include "k8sdockside.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.providers }}
  # Mounted at /etc/k8sdockside/auth/providers.json.
  providers.json: {{ include "k8sdockside.providersJSON" . | b64enc }}
  {{- end }}
  {{- if eq $adminMode "inline" }}
  admin-username: {{ .Values.auth.bootstrapAdmin.username | toString | b64enc }}
  admin-password: {{ .Values.auth.bootstrapAdmin.password | toString | b64enc }}
  {{- end }}
  {{- if $setupTokenInline }}
  setup-token: {{ .Values.auth.setupToken | toString | b64enc }}
  {{- end }}
{{- end }}
