{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8sdockside.serviceAccountName" . }}
  labels:
    {{- include "k8sdockside.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Matches the pod: the token is only worth mounting when the app is meant to
# use it for the cluster it runs in.
automountServiceAccountToken: {{ .Values.clusters.inCluster.enabled }}
{{- end }}
