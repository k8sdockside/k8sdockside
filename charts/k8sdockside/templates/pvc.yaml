{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "k8sdockside.fullname" . }}
  labels:
    {{- include "k8sdockside.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keep .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keep }}
    # Left behind by `helm uninstall`, with the users and sessions on it.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  {{- if eq "-" . }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ . | quote }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
