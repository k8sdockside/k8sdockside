name: Setup build environment
description: >-
  Installs everything a k8sdockside build needs: the Linux GUI headers Wails
  links against (unless gui-deps is "false"), Go from go.mod, the wails3 CLI
  pinned to the version go.mod requires, and optionally Node.

inputs:
  node-version:
    description: Node version to install. Set to "none" to skip Node entirely.
    required: false
    default: '24'
  wails:
    description: Install the wails3 CLI. Set to "false" to skip it.
    required: false
    default: 'true'
  gui-deps:
    description: >-
      Install the GTK and WebKitGTK headers the desktop app links against. Set
      to "false" for a job that only generates bindings or builds server mode:
      the wails3 CLI is then built without cgo, which needs none of them.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Wails links against GTK 4 and WebKitGTK 6 on Linux, and the wails3 CLI is
    # a Go program in the same module, so it needs the headers too -- not only
    # the app. Without these, nothing here compiles.
    - name: Install Linux GUI build dependencies
      if: runner.os == 'Linux' && inputs.gui-deps == 'true'
      shell: bash
      # Composite steps take no timeout-minutes, so each apt call has its own:
      # a mirror that stops answering is tried again a few times, and given
      # up on after five minutes, instead of holding the job until its limit.
      run: |
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        timeout 300 sudo apt-get "${apt_opts[@]}" update
        timeout 600 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Set up Node
      if: inputs.node-version != 'none'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Pin the CLI to the exact wails version the module depends on. A CLI newer
    # than the library generates bindings the app cannot compile against, and
    # the beta line moves often enough for that to be a real risk.
    - name: Resolve wails3 version
      if: inputs.wails == 'true'
      id: wails-version
      shell: bash
      run: |
        {
          echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "gobin=$(go env GOPATH)/bin"
        } >> "$GITHUB_OUTPUT"

    # The cgo and the pure-Go builds of the CLI are cached apart: a cgo build
    # links GTK at run time, and would not start on a runner without it. Both
    # branches of the expression are non-empty on purpose: `cond && '' || x`
    # is always x, because '' counts as false.
    - name: Cache wails3 CLI
      if: inputs.wails == 'true'
      id: wails-cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.wails-version.outputs.gobin }}
        key: ${{ runner.os }}-${{ runner.arch }}-wails3-${{ steps.wails-version.outputs.version }}-${{ inputs.gui-deps == 'true' && 'cgo' || 'nocgo' }}

    - name: Install wails3 CLI
      if: inputs.wails == 'true' && steps.wails-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CGO_ENABLED: ${{ inputs.gui-deps == 'true' && '1' || '0' }}
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails-version.outputs.version }}

    # setup-go generally puts GOPATH/bin on the PATH already; doing it here too
    # is harmless and makes this action self-contained.
    - name: Add Go bin to PATH
      if: inputs.wails == 'true'
      shell: bash
      run: echo "${{ steps.wails-version.outputs.gobin }}" >> "$GITHUB_PATH"
