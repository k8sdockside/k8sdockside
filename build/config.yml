# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Roger Westerbø" # The name of the company
  productName: "K8s Dockside" # The name of the application
  productIdentifier: "io.github.rogerwesterbo.k8sdockside" # The unique product identifier
  description: "A Kubernetes workspace for your local kubeconfig contexts" # The application description
  copyright: "© 2026, Roger Westerbø" # Copyright text
  comments: "https://github.com/k8sdockside/k8sdockside" # Comments
  version: "0.0.1" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "io.github.rogerwesterbo.k8sdockside"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "K8s Dockside"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.0.1"
#   # The company/organisation name for templates and project settings
#   company: "Roger Westerbø"
#   # Additional comments to embed in Info.plist metadata
#   comments: ""

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    # The vite dev server, started directly rather than via common:dev:frontend.
    # That task depends on install:frontend:deps, and Task keys its up-to-date
    # fingerprint by full task name -- the blocking build above already installed
    # under darwin:common:install:frontend:deps:npm, so invoking it again under
    # common: misses the cache and re-runs npm install every time. That put a
    # 45s+ install ahead of vite while the primary task below was already
    # polling :9245, which it only does for a few seconds before giving up with
    # "unable to connect to frontend server". Deps are guaranteed present here:
    # the build above is blocking and installs them.
    - cmd: wails3 task common:frontend:dev:npm
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
